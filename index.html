<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Forensic Due Diligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/styles/app.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-cyan-400">Internal Risk Intelligence</p>
          <h1 class="text-xl font-semibold">AI Forensic Due Diligence Engine</h1>
        </div>
        <span class="text-xs bg-slate-800 px-3 py-1 rounded-full">Global OSINT Coverage</span>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid lg:grid-cols-3 gap-6">
      <section class="lg:col-span-1 card p-6 h-fit">
        <h2 class="text-lg font-semibold mb-4">Entity Screening Input</h2>
        <form id="intel-form" class="space-y-4">
          <div>
            <label class="block text-sm mb-1">Company Name <span class="text-rose-400">*</span></label>
            <input id="companyName" class="input" required placeholder="Example: Acme Holdings Ltd" />
          </div>
          <div>
            <label class="block text-sm mb-1">Country</label>
            <input id="country" class="input" placeholder="Example: UK" />
          </div>
          <div>
            <label class="block text-sm mb-1">Website</label>
            <input id="website" class="input" placeholder="https://example.com" />
          </div>
          <button class="btn-primary w-full" type="submit">Generate Intelligence Report</button>
        </form>

        <div id="pipeline-status" class="mt-6 hidden">
          <p class="text-sm font-medium mb-2">Pipeline Progress</p>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-label" class="text-xs text-slate-400 mt-2">Initializing...</p>
        </div>
      </section>

      <section class="lg:col-span-2 space-y-6">
        <div class="card p-4 flex flex-wrap gap-3">
          <button id="download-pdf" class="btn-secondary" disabled>Download PDF</button>
          <button id="copy-report" class="btn-secondary" disabled>Copy Report Text</button>
          <button id="toggle-raw" class="btn-secondary" disabled>View Raw Intelligence Sources</button>
        </div>

        <article class="card p-6" id="report-viewer">
          <p class="text-slate-400">Run a screening to generate a professional due diligence report.</p>
        </article>

        <section class="card p-6 hidden" id="raw-viewer">
          <h3 class="text-lg font-semibold mb-4">Raw Intelligence Source Payload</h3>
          <pre id="raw-output" class="raw-box"></pre>
        </section>
      </section>
    </main>

    <script src="/public/app.js"></script>
  </body>
</html>
